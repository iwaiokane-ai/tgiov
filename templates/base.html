<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Music Service{% endblock %}</title>
  <style>
    :root { --bg:#12101c; --card:#1d1a2e; --accent:#a855f7; --accent2:#ec4899; --text:#f3f0ff; --muted:#9a94b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { background: var(--card); border-bottom: 1px solid #2d2945; }
    nav { max-width: 960px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
    nav .logo { font-weight: 700; font-size: 1.2rem; color: var(--text); margin-right: auto; }
    main { max-width: 960px; margin: 0 auto; padding: 30px 20px 60px; }
    h1 { margin-top: 0; }
    .hero { text-align: center; padding: 40px 0 20px; }
    .hero h1 { font-size: 2.4rem; background: linear-gradient(90deg, var(--accent), var(--accent2));
               -webkit-background-clip: text; background-clip: text; color: transparent; }
    .muted { color: var(--muted); }
    .btn { display: inline-block; padding: 10px 22px; border-radius: 999px; border: 0; cursor: pointer; font-size: 1rem;
           background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }
    .btn:hover { text-decoration: none; opacity: .9; }
    .stats { display: flex; gap: 16px; justify-content: center; margin: 26px 0; flex-wrap: wrap; }
    .card { background: var(--card); border-radius: 14px; padding: 20px; border: 1px solid #2d2945; }
    .stat { min-width: 150px; text-align: center; }
    .stat b { display: block; font-size: 2rem; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #2d2945; }
    th { color: var(--muted); font-weight: 500; font-size: .9rem; }
    tr:hover td { background: #231f38; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #2d2945; font-size: .85rem; }
    form.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    input, select { padding: 9px 12px; border-radius: 8px; border: 1px solid #3a3558; background: var(--card); color: var(--text); font-size: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .grid .card { text-align: center; }
    .grid .card b { display: block; font-size: 1.3rem; }
    .cover { width: 160px; height: 160px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
             font-size: 4rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); margin-bottom: 16px; }
    footer { text-align: center; color: var(--muted); padding: 20px; font-size: .9rem; }
    @media (max-width: 600px) { .hide-sm { display: none; } }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="/">🎵 Music Service</a>
      <a href="/tracks">Треки</a>
      <a href="/genres">Жанры</a>
      <a href="/random">Случайный трек</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Лабораторная работа №1 · Flask на Render.com ·
    <a href="?format=json">смотреть как JSON</a></footer>
</body>
</html>
