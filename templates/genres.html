{% extends "base.html" %}
{% block title %}Жанры — Music Service{% endblock %}
{% block content %}
<h1>Жанры</h1>
<div class="grid">
  {% for name, count in genres.items() %}
  <a class="card" href="/tracks?genre={{ name }}" style="color:inherit">
    <b>{{ name }}</b>
    <span class="muted">треков: {{ count }}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
